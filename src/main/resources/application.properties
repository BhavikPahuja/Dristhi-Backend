spring.application.name=criminal-network-intelligence
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/dristhi}}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:12345678}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
nlp.service.url=${NLP_SERVICE_URL:http://localhost:8001}
ml.service.url=${ML_SERVICE_URL:http://localhost:8002}
agent.service.url=${AGENT_SERVICE_URL:http://localhost:8003}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.project.tekathon.drishti=INFO
